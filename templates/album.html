<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <a href="/">返回</a>
        <span>{{folder_name}}</span>
    </div>
    {% if group %}
        {% for sub_folder, images in group.items() %}
            <div class="group">
                <h2>{{ sub_folder }}</h2>
                {% if images %}
                    <div class="grid">
                        {% for image in images %}
                            <div class="grid-item">
                                <img src="{{ image.thumb }}" loading="lazy"  onclick="openViewer({{image.index}})" alt="">

                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="empty">暂无图片</div>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
    <div class="empty">暂无图片</div>
    {% endif %}

    <div id="viewer" class="viewer">
        <button class="close-btn" onclick="closeViewer()">✕</button>
        <div class="swiper" id="swiper">
            {% for url in all_orgin %}
            <div class="swiper-slide">
                <img data-src="{{ url }}">
            </div>
            {% endfor %}
        </div>
    </div>

<script>
const total = {{ all_orgin | length }};
const viewer = document.getElementById('viewer');
const swiper = document.getElementById('swiper');
let currentIndex=0;

function loadImage(i){
    if (i<0 || i>=total){
        return ;
    }
    let img = document.querySelectorAll('.swiper-slide img')[i];
    if(img.src){
        return ;
    }
    img.src = img.dataset.src;

}

function preload(index){
    loadImage(index);
    loadImage(index+1);
    loadImage(index-1);
}

function Goto(index,smooth = true){
    if(index<0||index>=total){
        return ;
    }
    currentIndex=index;
    preload(index);
    swiper.scrollTo({
        left: swiper.clientWidth*index,
        behavior: smooth? 'smooth' : 'auto'
    });
}

function openViewer(index) {
    currentIndex = index;

    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';
    Goto(index,false);
}

//滑动切换图片,加上防抖功能
let scrolltime = null 
swiper.addEventListener('scroll',function(){
    clearTimeout(scrolltime);
    scrolltime = setTimeout(() => {
        let index = Math.round(this.scrollLeft / this.clientWidth );
        if (index == currentIndex) {
            return;
        }
        currentIndex = index;
        preload(index);
    }, 200);

})

function closeViewer() {
    viewer.classList.remove('active');
    document.body.style.overflow = 'auto'; 
}
//键盘esc，方向键监听
document.addEventListener('keydown',function(e){
    if (!viewer.classList.contains('active')) return;
    switch(e.key){
        case 'Escape': 
            closeViewer();
            break;
        case 'ArrowLeft':
            e.preventDefault();
            Goto(currentIndex-1,true);
            break;
        case 'ArrowRight':
            e.preventDefault();
            Goto(currentIndex+1,true);
            break;
    }  
})
//点击背景切换图片或关闭大图
viewer.addEventListener('click',function(e){
    if (e.target.tagName === 'BUTTON') {
        return;
    }
    let x = e.clientX;
    let w = window.innerWidth;;

    if( x < w/3){
        Goto(currentIndex-1,true);
    }
    else if(x > w*2/3){
        Goto(currentIndex+1,true);
    }
    else{
        closeViewer();
    }
})

</script>

</body>
</html>
