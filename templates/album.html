<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% if group %}
        {% for sub_folder, images in group.items() %}
            <div class="group">
                <h3>{{ sub_folder }}</h3>
                {% if images %}
                    <div class="grid">
                        {% for image in images %}
                            <div class="grid-item">
                                <img src="{{ image.thumb }}" loading="lazy" alt="">
                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="empty">暂无图片</div>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
    <div class="empty">暂无图片</div>
    {% endif %}
</body>
</html>
