<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <a href="/">返回</a>
        <span>{{folder_name}}</span>
    </div>
    <!-- {% if flat %} -->
        {% for group in flat %}
            <div class="group" style="margin-left: {{group.level * 20}}px;" data-level="{{group.level}}">
                <h2 onclick="toggleGroup(this)">{{ folder_name }}</h2>
                {% if group.images %}
                    <div class="grid">
                        {% for image in group.images %}
                            <div class="grid-item">
                                <img src="{{ image.thumb_url }}" loading="lazy" fetchpriority="low" onclick="openViewer({{image.index}})" alt="">

                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="empty">暂无图片</div>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
    <div class="empty">暂无图片</div>
    {% endif %}

    <div id="viewer" class="viewer">
        <button class="close-btn" onclick="closeViewer()">✕</button>
        <div class="swiper" id="swiper">
            {% for url in all_original %}
            <div class="swiper-slide">
                <img data-src="{{ url }}">
            </div>
            {% endfor %}
        </div>
    </div>

<script>
//目录折叠
/*
这里给group加入两个css类，collapsed记录自身被隐藏，hidden-by-parent记录被祖先隐藏
用level判断下一个group是不是自己的儿子，如果下一个level小于等于自己，说明是自己的兄弟或祖先，可直接跳出循环
*/
function toggleGroup(h2){
    const group = h2.parentElement;
    const level = Number(group.dataset.level);
    const isCollapsed = group.classList.toggle('collapsed');
    
    let sib = group.nextElementSibling;
    while(sib){
        let sib_level = Number(sib.dataset.level);
        if(level>=sib_level) break;

        if(isCollapsed){
            sib.classList.add('hidden-by-parent');
        }
        else{
            sib.classList.remove('hidden-by-parent');
        }
        sib = sib.nextElementSibling;
    }
}

//图片网格显示

const total = {{ all_original | length }};
const viewer = document.getElementById('viewer');
const swiper = document.getElementById('swiper');
let currentIndex=0;

function loadImage(i){
    if (i<0 || i>=total){
        return ;
    }
    let img = document.querySelectorAll('.swiper-slide img')[i];
    if (!img) {         
        return;
    }
    if(img.src){
        return ;
    }
    img.fetchPriority = 'high';
    img.src = img.dataset.src;
}

function preload(index){
    loadImage(index);
    loadImage(index+1);
    loadImage(index-1);
}

function resetZoom(){
    if(zoomedImg){
        zoomedImg.style.transform = 'scale(1)';
        isZoomed = false;
        zoomedImg = null;
        swiper.classList.remove('zoomed');
        translateX = 0;
        translateY = 0;
        currentX = 0;
        currentY = 0;
        isDragging = false;
        didDrag = false;
    }
}

function Goto(index,smooth = true){
    if(index<0||index>=total){
        return ;
    }
    currentIndex=index;
    preload(index);
    swiper.scrollTo({
        left: swiper.clientWidth*index,
        behavior: smooth? 'smooth' : 'auto'
    });
    resetZoom();
}

function openViewer(index) {
    currentIndex = index;

    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';
    Goto(index,false);
}

//滑动切换图片,加上防抖功能
let scrollTimer = null 
swiper.addEventListener('scroll',function(){
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
        if (this.clientWidth === 0) return;
        let index = Math.round(this.scrollLeft / this.clientWidth );
        if (index == currentIndex) {
            return;
        }
        currentIndex = index;
        preload(index);
        resetZoom();
    }, 200);
    
})

function closeViewer() {
    viewer.classList.remove('active');
    document.body.style.overflow = 'auto';
    resetZoom();
}
//键盘esc，方向键监听
document.addEventListener('keydown',function(e){
    if (!viewer.classList.contains('active')) return;
    switch(e.key){
        case 'Escape': 
            closeViewer();
            break;
        case 'ArrowLeft':
            e.preventDefault();
            Goto(currentIndex-1,true);
            break;
        case 'ArrowRight':
            e.preventDefault();
            Goto(currentIndex+1,true);
            break;
    }  
})
//单击切图/关闭
let clickTimer = null;
//mouseup时，会触发一次click，使用didDrag记录状态，拖拽超过一定距离标记为拖拽
let didDrag = false;
viewer.addEventListener('click',function(e){
    if(didDrag){
        didDrag = false;
        return;
    }
    if (e.target.tagName === 'BUTTON') {
        return;
    }
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
        let x = e.clientX;
        let w = window.innerWidth;
        if(!isZoomed){
            if( x < w/3){
                Goto(currentIndex-1,true);
            }
            else if(x > w*2/3){
                Goto(currentIndex+1,true);
            }
            else{
                closeViewer();
            }
        }
    },250)    
})
//双击放大
let isZoomed = false;
let zoomedImg = null;
viewer.addEventListener('dblclick',function(e){
    clearTimeout(clickTimer);
    if(e.target.tagName !== 'IMG'){
        return;
    }
    isZoomed = !isZoomed;
    let img = e.target;
    if(isZoomed){
        img.style.transform = 'scale(2)';
        swiper.classList.add('zoomed');
        zoomedImg = img;
    }
    else{
        img.style.transform = 'scale(1)';
        swiper.classList.remove('zoomed');
        zoomedImg = null
    }
})
//拖动函数
let isDragging = false;
let startX = 0, startY = 0;          // 手指按下时的坐标
let translateX = 0, translateY = 0;  // 图片当前的平移量
let maxX = 0;
let maxY = 0;
function startDragging(x, y){
    if(!isZoomed) return;
    
    startX = x;
    startY = y;
    maxX = Math.max(0, (2*zoomedImg.clientWidth - swiper.clientWidth)/2);
    maxY = Math.max(0, (2*zoomedImg.clientHeight - swiper.clientHeight)/2);
    isDragging=true;
    zoomedImg.classList.add('dragging')
}
let newX = 0;
let newY = 0;
function moveDragging(x,y){
    if(!isZoomed) return;
    let dx = x - startX;
    let dy = y - startY;
    if(Math.abs(dx)>5 || Math.abs(dy)>5){
        didDrag = true;
    }
    newX = translateX + dx;
    newY = translateY + dy;
    newX = Math.max(-maxX, Math.min(newX, maxX));//这里判断x坐标是否合法，须在-maxX与maxX之间；
    newY = Math.max(-maxY, Math.min(newY, maxY));
    zoomedImg.style.transform =  `translate3d(${newX}px, ${newY}px, 0) scale(2)`;
}
function endDragging(){
    if(!isDragging) return;
    translateX = newX;
    translateY = newY;
    isDragging = false;
    zoomedImg.classList.remove('dragging');
}
//触摸滑动
swiper.addEventListener('touchstart',function(e){
    if(e.touches.length !== 1){
        return ;
    }
    didDrag = false;
    startDragging(e.touches[0].clientX,e.touches[0].clientY);
})
swiper.addEventListener('touchmove',function(e){
    if(!isDragging) return;
    e.preventDefault();
    moveDragging(e.touches[0].clientX,e.touches[0].clientY);
}, { passive: false })
swiper.addEventListener('touchend',function(e){
    endDragging();
})
//鼠标拖拽
swiper.addEventListener('mousedown',function(e){
    didDrag = false;
    startDragging(e.clientX,e.clientY);
})
document.addEventListener('mousemove',function(e){
    if(!isDragging) return;
    moveDragging(e.clientX,e.clientY);
})
document.addEventListener('mouseup',function(e){
    endDragging();
})


</script>

</body>
</html>
