<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <a href="/">返回</a>
        <span>{{folder_name}}</span>
    </div>
    {% if group %}
        {% for sub_folder, images in group.items() %}
            <div class="group">
                <h3>{{ sub_folder }}</h3>
                {% if images %}
                    <div class="grid">
                        {% for image in images %}
                            <div class="grid-item">
                                <img src="{{ image.thumb }}" loading="lazy"  onclick="openViewer({{image.index}})" alt="">

                            </div>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="empty">暂无图片</div>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
    <div class="empty">暂无图片</div>
    {% endif %}

    <div id="viewer" class="viewer">
        <button class="close-btn" onclick="closeViewer()">✕</button>
        <div class="swiper" id="swiper">
            {% for url in all_orgin %}
            <div class="swiper-slide">
                <img data-src="{{ url }}">
            </div>
            {% endfor %}
        </div>
    </div>

<script>
const total = {{ all_orgin | length }};

function loadImage(i){
    if (i<0 || i>=total){
        return 
    }
    let img = document.querySelectorAll('.swiper-slide img')[i];
    if(img.src){
        return 
    }
    img.src = img.dataset.src;

}

function openViewer(index) {
    loadImage(index)
    loadImage(index+1)
    loadImage(index-1)

    document.getElementById('viewer').classList.add('active');
    document.body.style.overflow = 'hidden';
    let swiper = document.getElementById('swiper');
    swiper.scrollLeft = swiper.clientWidth * index;
}

const  swiper = document.getElementById('swiper'); 
let scrolltime = null 
swiper.addEventListener('scroll',function(){
    clearTimeout(scrolltime);
    scrolltime = setTimeout(() => {
        let index = Math.round(this.scrollLeft / this.clientWidth );
        loadImage(index);
        loadImage(index+1);
        loadImage(index-1);
    }, 100);

})


function closeViewer() {
    document.getElementById('viewer').classList.remove('active');
    document.body.style.overflow = 'auto'; 
}
</script>

</body>
</html>
